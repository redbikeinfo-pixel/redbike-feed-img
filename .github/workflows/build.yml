name: build-square-images
on:
  push:
    branches: [main]
    paths: [urls.csv, process.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow requests
      - run: python process.py
        continue-on-error: true
      - name: Commit images
        run: |
          git config user.name "feed-image-bot"
          git config user.email "bot@users.noreply.github.com"
          git add img
          git diff --cached --quiet || (git commit -m "Add square images" && git push)
